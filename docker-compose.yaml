# cifsQuant containers — Stages 2/3 and the GUI.
# Stage 1 (Nextflow + Cellpose) runs on the host because it spawns its own
# Docker containers; run it with `python run_cifsquant.py --stages segmentation`.
#
#   docker compose up gui           # Streamlit GUI at http://localhost:8501
#   docker compose run --rm cli     # interactive shell in the pipeline env
#
# The repo is bind-mounted over /app so configs edited in the GUI, gating
# outputs, and spatial results all land in your working copy.

services:
  gui:
    build: .
    container_name: cifsquant_gui
    ports:
      - "8501:8501"
    volumes:
      - ./:/app
    working_dir: /app
    environment:
      - PYTHONPATH=/app

  cli:
    build: .
    container_name: cifsquant_cli
    volumes:
      - ./:/app
    working_dir: /app
    environment:
      - PYTHONPATH=/app
    command: bash
    stdin_open: true
    tty: true
    profiles:
      - cli
